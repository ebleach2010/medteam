<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1420" />
  <title>MedTeam — ED Chaos</title>
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="boot">
    <div class="bootlogo">MED<span>TEAM</span></div>
    <div class="bootmsg">Loading…</div>
  </div>
  <!-- Boot watchdog. The classic PWA failure: a cached service worker serves a
       stale index.html pointing at a bundle hash this deploy deleted, so the
       page sits on the splash forever. We heal it: drop the SW + caches once
       and reload with a cache-busting URL the stale worker can't satisfy from
       precache. Triggered the instant the bundle fails to load (script onerror
       / chunk error), with a slow timer as a backstop. Inline, non-module. -->
  <script>
  (function () {
    var KEY = 'medteam.selfheal';
    var healing = false;
    function heal(reason) {
      if (healing || window.__game) return;
      healing = true;
      var msg = document.querySelector('#boot .bootmsg');
      var tried = false;
      try { tried = sessionStorage.getItem(KEY) === '1'; } catch (e) {}
      if (tried) {
        if (msg) msg.innerHTML = "Couldn't start.<br>Close the app fully and reopen,<br>or delete the icon and re-add it.";
        return;
      }
      try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
      if (msg) msg.textContent = 'Updating…';
      // reload to a fresh URL so a still-controlling stale worker can't serve
      // the old cached navigation back to us
      var fresh = function () {
        var u = location.pathname + '?fresh=' + Date.now();
        try { location.replace(u); } catch (e) { location.reload(); }
      };
      try {
        var jobs = [];
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          }));
        }
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        Promise.all(jobs).then(fresh, fresh);
        setTimeout(fresh, 2500); // belt and braces
      } catch (e) { fresh(); }
    }
    // (main.js clears the KEY latch itself once the game is up)
    // the bundle itself failed to fetch/parse (the 404'd-chunk case) → heal now
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t.tagName === 'SCRIPT' && /main\.js|index-.*\.js/.test(t.src || '')) heal('script');
    }, true);
    // backstop: if nothing has booted after a slow-phone-friendly wait, heal
    setTimeout(function () { heal('timeout'); }, 9000);
  })();
  </script>
  <script type="module" src="/src/main.js" onerror="/* caught by capture listener above */"></script>
</body>
</html>
